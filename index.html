<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#000000">
  <meta name="description" content="Visualizador social de fotos e vídeos">
  <title>Meu Feed Social</title>
  <link rel="stylesheet" href="css/styles.css?v=cloud1">
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <header class="app-header">
    <h1>Social Media PWA</h1>
    <div class="media-actions">
      <button type="button" id="gallery-photo-button" class="btn-select media-button" aria-label="Selecionar fotos da galeria">
        <i data-lucide="images"></i><span>Fotos</span>
      </button>
      <button type="button" id="gallery-video-button" class="btn-select media-button" aria-label="Selecionar vídeos da galeria">
        <i data-lucide="film"></i><span>Vídeos</span>
      </button>
      <button type="button" id="camera-photo-button" class="btn-select media-button btn-secondary" aria-label="Tirar foto">
        <i data-lucide="camera"></i><span>Foto</span>
      </button>
      <button type="button" id="camera-video-button" class="btn-select media-button btn-secondary" aria-label="Gravar vídeo">
        <i data-lucide="video"></i><span>Vídeo</span>
      </button>

      <input type="file" id="gallery-photo-input" accept="image/*" multiple hidden>
      <input type="file" id="gallery-video-input" accept="video/*" multiple hidden>
      <input type="file" id="camera-photo-input" accept="image/*" capture="environment" hidden>
      <input type="file" id="camera-video-input" accept="video/*" capture="environment" hidden>
    </div>
  </header>

  <main id="feed-container" class="feed-container">
    <div class="empty-state" id="empty-state">
      <p>Nenhuma foto ou vídeo selecionado.</p>
      <p>Escolha uma mídia da galeria ou use os botões de câmera.</p>
      <small>As fotos são enviadas ao Vercel Blob, os vídeos ao Mux e os metadados são registrados no Neon.</small>
    </div>
  </main>

  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="js/media-cloud.js?v=mux1"></script>
  <script src="js/app.js?v=mux1"></script>
  <script src="js/engajamento.js?v=cloud1"></script>
</body>
</html>
