<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meu Feed Social</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#000000">
</head>
<body>

  <!-- Cabecalho Fixo -->
  <header class="app-header">
    <h1>Social Media PWA</h1>
    <label for="media-input" class="btn-select">
      <span>+ Adicionar Fotos/Vídeos</span>
      <input type="file" id="media-input" accept="image/*,video/*" multiple hidden>
    </label>
  </header>

  <!-- Feed de Mídias estilo Rede Social -->
  <main id="feed-container" class="feed-container">
    <div class="empty-state" id="empty-state">
      <p>Nenhuma foto ou vídeo selecionado.</p>
      <p>Clique no botão acima para carregar suas mídias do celular ou computador.</p>
    </div>
  </main>

  <script src="js/app.js"></script>
</body>
</html>
